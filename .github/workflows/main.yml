name: Node.js CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      # Configura Node.js e implementa el Caching de NPM
      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      # Instala dependencias (usa npm install en lugar de ci para mayor robustez)
      - name: Install Dependencies
        run: npm install

      # Ejecuta las pruebas unitarias
      - name: Run Jest Tests
        run: npm test

  build:
    name: Build (Verification)
    runs-on: ubuntu-latest
    needs: [test] # Este job SOLO se ejecuta si el job 'test' pasa.
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          
      - name: Install Dependencies
        run: npm install
        
      # El paso 'build' para Node.js APIs es usualmente una verificación
      - name: Run Build Script
        run: npm run build --if-present
        
  # --- NUEVO JOB: DOCKER ---
  deploy-docker:
    name: Build & Push to Docker Hub
    runs-on: ubuntu-latest
    needs: [build] # Solo se ejecuta si el build de Node pasa
    if: github.ref == 'refs/heads/main' # Solo se ejecuta en la rama main
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Reemplaza 'tu-usuario' por tu nombre de Docker Hub o usa la variable
          tags: |
            ${{ secrets.DOCKER_USER }}/yoga-pilates:latest
            ${{ secrets.DOCKER_USER }}/yoga-pilates:${{ github.sha }}
        
      #Deploy
      - name: Deploy
        if: github.ref == 'refs/heads/main'
        env:
          deploy_url: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl "$deploy_url
